<article class="card venue-card mb-3">
    <div class="card-body d-flex justify-content-between align-items-center">
        <div>
            <h2 class="card-title h5">{{ venue.name|default:"Без названия" }}</h2>
            <p class="card-text text-muted mb-2">{{ venue.address|default:"адрес не указан" }}</p>
            <a href="{% url 'venues:detail' venue.id %}" class="btn btn-sm btn-primary">
                Подробнее
            </a>
        </div>
        <span class="badge bg-primary rounded-pill">до {{ venue.capacity }} чел.</span>
    </div>
</article>
