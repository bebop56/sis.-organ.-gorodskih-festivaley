{% extends "base.html" %}

{% block title %}Площадки – FestCity{% endblock %}

{% block content %}
    <h1 class="mb-2">Площадки</h1>
    <p class="text-muted">Всего площадок: {{ venues|length }}</p>

    {% for venue in venues %}
        {% include "venues/includes/venue_card.html" %}
    {% empty %}
        <p>Площадки не найдены.</p>
    {% endfor %}
{% endblock %}
